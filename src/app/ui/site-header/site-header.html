<header class="header">
  <app-brand-mark />

  <ng-container [ngTemplateOutlet]="search" [ngTemplateOutletContext]="{ place: 'header' }" />

  <nav class="header__nav" aria-label="Розділи сайту">
    <ul class="header__row">
      @for (destination of destinations(); track destination.link) {
        <li><a class="header__link" [routerLink]="destination.link">{{ destination.label }}</a></li>
      }
    </ul>
  </nav>

  <app-selection-link
    class="header__selection"
    [count]="selectionCount()"
    [link]="selectionLink()"
  />

  @if (phone()) {
    <a class="header__call" [href]="callHref()" aria-label="Зателефонувати">
      <svg
        class="header__glyph"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6.2 2.8h-3v3c0 6.1 5 11.1 11.1 11.1h3v-3l-3.6-1.2-1.8 1.8a13 13 0 0 1-6.1-6.1l1.8-1.8Z" />
      </svg>
    </a>
  }

  <app-action-button class="header__opener" opens="dialog" (pressed)="open()">Меню</app-action-button>

  <dialog #menu class="menu" aria-label="Розділи сайту">
    <div class="menu__frame">
      <div class="menu__head">
        <h2 class="menu__title">Розділи</h2>
        <app-action-button (pressed)="close()">Закрити</app-action-button>
      </div>

      <ng-container [ngTemplateOutlet]="search" [ngTemplateOutletContext]="{ place: 'menu' }" />

      <nav class="menu__body">
        <ul class="menu__list">
          @for (destination of destinations(); track destination.link) {
            <li>
              <a class="menu__link" [routerLink]="destination.link" (click)="close()">
                {{ destination.label }}
              </a>
            </li>
          }
        </ul>
      </nav>

      @if (phone()) {
        <a class="menu__phone" [href]="callHref()">{{ phone() }}</a>
      }
    </div>
  </dialog>
</header>

<ng-template #search let-place="place">
  <form
    [class]="place === 'menu' ? 'menu__search' : 'header__search'"
    role="search"
    (submit)="submitSearch($event, field.value)"
  >
    <input
      #field
      class="header__field"
      type="search"
      autocomplete="off"
      aria-label="Пошук товарів"
      placeholder="Пошук"
    />
  </form>
</ng-template>
