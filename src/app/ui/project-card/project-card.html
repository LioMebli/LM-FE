<article class="project">
  <span class="project__media">
    @if (image(); as photo) {
      <img class="project__image" [ngSrc]="photo.src" [alt]="photo.alt" fill />
    }
  </span>

  <div class="project__body">
    <h3 class="project__name">{{ name() }}</h3>
    <p class="project__lede">{{ lede() }}</p>
  </div>
</article>
