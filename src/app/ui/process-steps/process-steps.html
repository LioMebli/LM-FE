<ol class="steps" role="list">
  @for (step of steps(); track step.label; let index = $index) {
    <li class="step lm-reveal">
      <span class="step__ordinal">{{ index + 1 }}</span>

      <div class="step__body">
        <h3 class="step__label">{{ step.label }}</h3>
        <p class="step__detail">{{ step.detail }}</p>
      </div>
    </li>
  }
</ol>
