@if (product(); as item) {
  <article>
    <h1>{{ item.name }}</h1>
    @if (item.shortDescription) {
      <p class="lead">{{ item.shortDescription }}</p>
    }
    <p class="availability">{{ availabilityLabels[item.availability] }}</p>
    @if (item.description) {
      <p>{{ item.description }}</p>
    }
  </article>
} @else {
  <app-not-found-page />
}
