<app-hero-panel [heading]="heading" [lede]="lede" [image]="hero" />

<section class="home__services" aria-labelledby="home-services">
  <h2 class="visually-hidden" id="home-services">Що ми робимо</h2>
  <app-service-row [services]="services" />
</section>

<section class="home__call">
  <app-call-band
    [heading]="callHeading"
    [lede]="callLede"
    [phone]="phone"
    [hours]="callHours"
  />
</section>

<section class="home__band" aria-labelledby="home-projects">
  <h2 class="home__eyebrow" id="home-projects">Наші останні проєкти</h2>

  <ul class="home__projects">
    @for (project of projects; track project.name) {
      <li>
        <app-project-card [name]="project.name" [lede]="project.lede" [image]="project.image" />
      </li>
    }
  </ul>
</section>

<section class="home__materials">
  <div class="home__band">
    <h2 class="home__eyebrow" id="home-materials">Якість, яку можна відчути</h2>
    <p class="home__lede">Оберіть матеріал, щоб розглянути ближче.</p>
    <app-material-picker [materials]="materials" />
  </div>
</section>

<section class="home__band" aria-labelledby="home-steps">
  <h2 class="home__eyebrow" id="home-steps">Три кроки до ваших ідеальних меблів</h2>
  <app-process-steps [steps]="steps" />
</section>

<section class="home__reviews">
  <div class="home__band home__band--narrow">
    <h2 class="home__eyebrow" id="home-reviews">Що говорять наші клієнти</h2>
    <app-testimonial-carousel [testimonials]="testimonials" />

    <div class="home__form">
      <app-review-form />
    </div>
  </div>
</section>
