<app-hero-banner [heading]="heading" [lede]="lede" />

@if (categories().length) {
  <section class="home__categories">
    <h2 class="home__heading">Категорії</h2>

    <ul class="home__grid">
      @for (category of categories(); track category.id) {
        <li>
          <app-category-card [name]="category.name" [link]="'/category/' + category.id" />
        </li>
      }
    </ul>
  </section>
}
