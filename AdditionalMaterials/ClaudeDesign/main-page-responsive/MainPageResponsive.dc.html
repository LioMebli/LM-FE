<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Головна сторінка (адаптивна)" description="Лендінг Lio Mebli, що сам перемикається між широким і мобільним виглядом за шириною екрана" -->
<helmet><style>*{box-sizing:border-box}body{margin:0;background:oklch(0.98 0.008 75)}</style></helmet>
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><dc-import name="MainPageWide" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ phone }}"><dc-import name="MainPagePhone" hint-size="100%,100vh"></dc-import></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;breakpoint&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:860,&quot;min&quot;:600,&quot;max&quot;:1100,&quot;step&quot;:20,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Адаптив&quot;}}">
class Component extends DCLogic {
  state = { wide: true };
  componentDidMount() {
    const bp = this.props.breakpoint ?? 860;
    this.mq = window.matchMedia('(min-width: ' + bp + 'px)');
    this.apply = () => this.setState({ wide: this.mq.matches });
    this.mq.addEventListener('change', this.apply);
    this.apply();
  }
  componentWillUnmount() { if (this.mq) this.mq.removeEventListener('change', this.apply); }
  renderVals() {
    return { wide: this.state.wide, phone: !this.state.wide };
  }
}
</script>
</body>
</html>
